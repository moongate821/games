<style>

<body>
<div id="wrap"><canvas id="c" width="600" height="720"></canvas></div>
<script>
// GRAVITY CORE — 中心の核へ向かって球を撃ち込む。重力は中心向き。核が回転して塊も回る。Space で反重力。
const cv=document.getElementById('c'),g=cv.getContext('2d');
const CW=600,CH=720,CX=300,CY=330,CORE=38,RING=270,LINE=225;
const R=[10,14,19,25,32,40,49,59,70,82];
const PTS=[10,20,40,80,160,320,640,1280,2560,5000];
const HUE=[350,25,50,100,165,195,225,265,300,330];
const GRAV=.3,SUB=4,DT=1/SUB;
let balls,parts,rings,floaters,bag,cur,nxt,ang,cool,chain,score,over,shake,t,freeze,rev,revCd,spin,best=+(localStorage.getItem('gc_best')||0),started=false,mute=false,acc=0,last=0,lastImp=0,maxLv,shots=0,lvl=1,precisionUsed=false;
function mkBag(){const a=[0,0,0,1,1,1,2,2,3,3];for(let i=9;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(){if(!bag.length)bag=mkBag();return bag.pop();}
function reset(){balls=[];parts=[];rings=[];floaters=[];bag=mkBag();cur=pick();nxt=pick();ang=-Math.PI/2;cool=0;chain=0;score=0;over=false;shake=0;t=0;freeze=0;rev=0;revCd=0;spin=.012;maxLv=0;shots=0;lvl=1;precisionUsed=false;}
reset();
let AC;function tone(f,d=.12,type='sine',v=.07,slide=0){if(mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),a=AC.createGain(),n=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(a);a.connect(AC.destination);o.start();o.stop(n+d);}catch(e){}}
const SC=[0,2,4,7,9,12,14,16,19,21,24,26];
function mk(x,y,lv){return{x,y,vx:0,vy:0,lv,r:R[lv],m:R[lv]*R[lv],ang:0,touch:-1,over:0,sc:1,scv:0,sq:0,sqv:0,sqa:0,dead:false,wob:.4,ph:Math.random()*6.28,age:0,shotId:0};}
function burst(x,y,h,n,sp=3){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:25+Math.random()*25,h});}}
function shoot(){
  if(cool>0||over)return;
  const r=R[cur],px=CX+Math.cos(ang)*(RING-8),py=CY+Math.sin(ang)*(RING-8);
  const b=mk(px,py,cur);b.vx=-Math.cos(ang)*5;b.vy=-Math.sin(ang)*5;b.sq=-.2;b.sqa=ang;b.shotId=shots+1;balls.push(b);precisionUsed=false;
  cur=nxt;nxt=pick();cool=30;chain=0;tone(200,.08,'square',.04,.6);shots++;if(shots%20===0){lvl++;spin*=1.18;shake=Math.max(shake,6);floaters.push({x:CX,y:CY-CORE-24,txt:'LEVEL '+lvl+' — 核が速くなる',life:90});tone(330,.3,'triangle',.1);tone(495,.4,'triangle',.08);}
}
function skill(){if(revCd>0||over||!started)return;rev=70;revCd=420;shake=8;tone(110,.4,'sawtooth',.12,2);rings.push({x:CX,y:CY,r:CORE,life:1,col:'#8af'});}
function merge(a,b){
  a.dead=b.dead=true;chain++;const lv=a.lv,x=(a.x*a.m+b.x*b.m)/(a.m+b.m),y=(a.y*a.m+b.y*b.m)/(a.m+b.m);
  const quick=!precisionUsed&&((a.shotId===shots&&a.age<90)||(b.shotId===shots&&b.age<90));
  if(quick){precisionUsed=true;revCd=Math.max(0,revCd-60);}
  const rv=rev>0?2:1,pts=Math.round(PTS[lv]*(1+.5*(chain-1))*rv*(quick?1.5:1));score+=pts;tone(261*Math.pow(2,SC[Math.min(chain-1,11)]/12),.35,'triangle',.1);
  floaters.push({x,y:y-a.r,txt:(quick?'QUICK! ':'')+'+'+pts+(chain>1?' ×'+chain:'')+(rv>1?' 反重力×2':''),life:50});rings.push({x,y,r:R[lv],life:1,col:'hsl('+HUE[lv]+',90%,70%)'});burst(x,y,HUE[lv],10+lv*3,3+lv*.4);
  freeze=Math.min(6,1+(lv>>1));shake=Math.max(shake,2+lv*1.5);
  if(lv===9){shake=20;burst(x,y,320,60,8);floaters.push({x,y:y-40,txt:'MAX!!',life:80});return;}
  const nb=mk(x,y,lv+1);nb.vx=(a.vx*a.m+b.vx*b.m)/(a.m+b.m);nb.vy=(a.vy*a.m+b.vy*b.m)/(a.m+b.m);nb.touch=0;nb.sc=.5;nb.scv=.05;nb.wob=1;nb.shotId=a.shotId===shots||b.shotId===shots?shots:0;nb.age=Math.min(a.age,b.age);
  const rad=nb.r*2;for(const o of balls){if(o.dead||o===nb)continue;const dx=o.x-x,dy=o.y-y,d=Math.hypot(dx,dy);if(d<rad&&d>1){const f=(1-d/rad)*2*(30/Math.sqrt(o.m));o.vx+=dx/d*f;o.vy+=dy/d*f;}}
  balls.push(nb);maxLv=Math.max(maxLv,lv+1);
}
function imp(b,v,a){if(v<.8)return;b.wob=Math.min(1,b.wob+v*.08);b.sq=Math.max(b.sq,Math.min(.5,v*.06));b.sqa=a;b.sqv=0;if(v>2.5&&t-lastImp>3){lastImp=t;tone(140+Math.min(300,v*30),.07,'sine',Math.min(.08,.02+v*.008),.6);}}
function step(){
  const gs=rev>0?-.7:1;
  for(const b of balls){const dx=CX-b.x,dy=CY-b.y,d=Math.hypot(dx,dy)||1;b.vx+=dx/d*GRAV*gs*DT;b.vy+=dy/d*GRAV*gs*DT;}
  for(const b of balls){b.x+=b.vx*DT;b.y+=b.vy*DT;b.vx*=.9995;b.vy*=.9995;}
  for(let it=0;it<4;it++){
    for(const b of balls){
      const dx=b.x-CX,dy=b.y-CY,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;
      if(d<CORE+b.r){const ov=CORE+b.r-d;b.x+=nx*ov;b.y+=ny*ov;const vn=b.vx*nx+b.vy*ny;if(vn<0){imp(b,-vn,Math.atan2(-ny,-nx));b.vx-=(1.04)*vn*nx;b.vy-=1.04*vn*ny;}
        b.vx+=-ny*spin*DT*30;b.vy+=nx*spin*DT*30;if(b.touch<0)b.touch=0;} // 核の回転で引きずられる
      if(d>RING-b.r){const ov=d-(RING-b.r);b.x-=nx*ov;b.y-=ny*ov;const vn=b.vx*nx+b.vy*ny;if(vn>0){b.vx-=1.05*vn*nx;b.vy-=1.05*vn*ny;}}
    }
    for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
      const a=balls[i],b=balls[j];if(a.dead||b.dead)continue;
      const dx=b.x-a.x,dy=b.y-a.y,rs=a.r+b.r,d2=dx*dx+dy*dy;if(d2>=(rs+6)*(rs+6))continue;
      if(d2>=rs*rs){const dd=Math.sqrt(d2)||.01,nx=dx/dd,ny=dy/dd,rvn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rvn>0){const is=1/a.m+1/b.m,j=rvn*.06/is;a.vx+=j*nx/a.m;a.vy+=j*ny/a.m;b.vx-=j*nx/b.m;b.vy-=j*ny/b.m;}continue;} // スライムのねばり(離れようとすると引き戻す)
      if(a.lv===b.lv&&a.lv<=9){merge(a,b);continue;}
      if(a.touch<0)a.touch=0;if(b.touch<0)b.touch=0;
      const d=Math.hypot(dx,dy)||.01,nx=dx/d,ny=dy/d,ov=rs-d,ia=1/a.m,ib=1/b.m,is=ia+ib;
      a.x-=nx*ov*ia/is*.42;a.y-=ny*ov*ia/is*.42;b.x+=nx*ov*ib/is*.42;b.y+=ny*ov*ib/is*.42;
      const rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;
      if(vn<0){imp(a,-vn,Math.atan2(ny,nx));imp(b,-vn,Math.atan2(-ny,-nx));const j2=-(1+.03)*vn/is;a.vx-=j2*ia*nx;a.vy-=j2*ia*ny;b.vx+=j2*ib*nx;b.vy+=j2*ib*ny;
        const tx=-ny,ty=nx,vt=rvx*tx+rvy*ty,jt=Math.max(-.3*j2,Math.min(.3*j2,-vt/is));a.vx-=jt*ia*tx;a.vy-=jt*ia*ty;b.vx+=jt*ib*tx;b.vy+=jt*ib*ty;}
    }
  }
}
function update(){
  t++;
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.life--;}parts=parts.filter(p=>p.life>0);
  for(const r of rings){r.r+=6;r.life-=.05;}rings=rings.filter(r=>r.life>0);
  for(const f of floaters){f.y-=.8;f.life--;}floaters=floaters.filter(f=>f.life>0);
  for(const b of balls){b.scv+=(1-b.sc)*.18;b.scv*=.88;b.sc+=b.scv;b.sqv+=-b.sq*.13;b.sqv*=.93;b.sq+=b.sqv;b.wob*=.975;}   // 流体らしく、やわらかく長く揺れる
  shake*=.86;
  if(!started||over)return;
  if(freeze>0){freeze--;return;}
  if(cool>0)cool--;if(rev>0)rev--;if(revCd>0)revCd--;
  if(t%600===0)spin=-spin*1.0; // 10秒ごとに回転が逆向きになる
  for(let s=0;s<SUB;s++)step();
  balls=balls.filter(b=>!b.dead);
  for(const b of balls){b.age++;b.touch>=0&&b.touch++;const d=Math.hypot(b.x-CX,b.y-CY);if(b.touch>=45&&d+b.r>LINE)b.over++;else b.over=Math.max(0,b.over-2);
    if(b.over>=90){over=true;tone(70,1.2,'sawtooth',.16);if(score>best){best=score;try{localStorage.setItem('gc_best',best)}catch(e){}}break;}}
}
function body(lv,x,y,r,o={}){
  g.save();g.translate(x,y);g.globalAlpha=o.alpha||1;const sc=o.sc||1;g.scale(sc,sc);
  if(o.sq){g.rotate(o.sqa||0);g.scale(1-o.sq,1+o.sq*.7);g.rotate(-(o.sqa||0));}
  const h=HUE[lv],gr=g.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r);gr.addColorStop(0,'hsl('+h+',95%,84%)');gr.addColorStop(.6,'hsl('+h+',85%,58%)');gr.addColorStop(1,'hsl('+h+',80%,30%)');
  g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,6.283);g.fill();g.fillStyle='rgba(255,255,255,.45)';g.beginPath();g.ellipse(-r*.35,-r*.42,r*.22,r*.12,-.6,0,6.283);g.fill();
  if(r>13){g.fillStyle='rgba(255,255,255,.85)';g.font='bold '+Math.max(9,r*.4|0)+'px sans-serif';g.textAlign='center';g.fillText(lv+1,0,r*.15);}
  g.restore();
}
function blobPts(b){
  const r=b.r*b.sc,N=36,pts=[],sp=Math.hypot(b.vx,b.vy),k2=Math.min(.22,sp*.018),va=Math.atan2(b.vy,b.vx);
  for(let i=0;i<N;i++){
    const th=i/N*6.2832;let ex=Math.cos(th),ey=Math.sin(th);
    {const ca=Math.cos(b.sqa),sa=Math.sin(b.sqa),u=ex*ca+ey*sa,v=-ex*sa+ey*ca,uu=u*(1-b.sq),vv=v*(1+b.sq*.8);ex=uu*ca-vv*sa;ey=uu*sa+vv*ca;}
    if(k2>.01){const ca=Math.cos(va),sa=Math.sin(va),u=ex*ca+ey*sa,v=-ex*sa+ey*ca,uu=u*(1+k2),vv=v*(1-k2*.5);ex=uu*ca-vv*sa;ey=uu*sa+vv*ca;}
    const wv=1+(.035+.09*b.wob)*Math.sin(th*3+t*.12+b.ph)+.022*Math.sin(th*5-t*.09+b.ph*2);   // 輪郭の波打ち
    let px=b.x+ex*r*wv,py=b.y+ey*r*wv;
    for(const o of balls){if(o===b||o.dead)continue;const dx=px-o.x,dy=py-o.y,orr=o.r*o.sc;if(dx>orr||dx<-orr||dy>orr||dy<-orr)continue;const d=Math.hypot(dx,dy);if(d<orr&&d>.01){px=o.x+dx/d*orr;py=o.y+dy/d*orr;}}
    {const dx=px-CX,dy=py-CY,d=Math.hypot(dx,dy);if(d<CORE&&d>.01){px=CX+dx/d*CORE;py=CY+dy/d*CORE;}}
    pts.push([px-b.x,py-b.y]);
  }
  return pts;
}
function slimeBody(b){
  const pts=blobPts(b),r=b.r,h=HUE[b.lv],N=pts.length;
  g.save();g.translate(b.x,b.y);
  const gr=g.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r*1.05);gr.addColorStop(0,'hsla('+h+',95%,86%,.9)');gr.addColorStop(.55,'hsla('+h+',85%,56%,.82)');gr.addColorStop(1,'hsla('+h+',80%,30%,.9)');
  g.fillStyle=gr;g.beginPath();
  g.moveTo((pts[0][0]+pts[N-1][0])/2,(pts[0][1]+pts[N-1][1])/2);
  for(let i=0;i<N;i++){const p=pts[i],q=pts[(i+1)%N];g.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2);}
  g.closePath();g.fill();
  g.save();g.clip();   // 内側で揺らぐ光(コースティクス)
  const cx=Math.cos(t*.04+b.ph)*r*.3,cy=Math.sin(t*.05+b.ph)*r*.3,cs=g.createRadialGradient(cx,cy,0,cx,cy,r*.8);
  cs.addColorStop(0,'hsla('+h+',100%,92%,.35)');cs.addColorStop(1,'hsla('+h+',100%,80%,0)');g.fillStyle=cs;g.fillRect(-r*1.3,-r*1.3,r*2.6,r*2.6);
  const rim=g.createRadialGradient(0,0,r*.7,0,0,r*1.15);rim.addColorStop(0,'hsla('+h+',90%,70%,0)');rim.addColorStop(1,'hsla('+h+',100%,85%,.55)');g.fillStyle=rim;g.fillRect(-r*1.3,-r*1.3,r*2.6,r*2.6);
  g.restore();
  g.strokeStyle='hsla('+h+',90%,82%,.5)';g.lineWidth=1.5;g.stroke();
  g.fillStyle='rgba(255,255,255,.5)';g.beginPath();g.ellipse(-r*.32,-r*.4,r*.24,r*.12,-.6,0,6.283);g.fill();
  g.fillStyle='rgba(255,255,255,.18)';g.beginPath();g.arc(r*.25,r*.3,r*.1,0,6.283);g.fill();
  if(r>13){g.fillStyle='rgba(255,255,255,.88)';g.font='bold '+Math.max(9,r*.4|0)+'px sans-serif';g.textAlign='center';g.fillText(b.lv+1,0,r*.15);}
  g.restore();
}
function drawBridges(){
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
    const a=balls[i],b=balls[j];if(a.dead||b.dead||a.lv!==b.lv)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),rs=a.r+b.r;if(d>rs+28||d<1)continue;
    const nx=dx/d,ny=dy/d,px=-ny,py=nx,w=Math.max(.12,1-Math.max(0,d-rs*.9)/(rs*.4)),wa=a.r*.5*w,wb=b.r*.5*w,mx=(a.x+b.x)/2,my=(a.y+b.y)/2,mw=Math.min(wa,wb)*.55;
    g.fillStyle='hsla('+HUE[a.lv]+',85%,58%,.94)';g.beginPath();
    g.moveTo(a.x+px*wa,a.y+py*wa);g.quadraticCurveTo(mx+px*mw,my+py*mw,b.x+px*wb,b.y+py*wb);
    g.lineTo(b.x-px*wb,b.y-py*wb);g.quadraticCurveTo(mx-px*mw,my-py*mw,a.x-px*wa,a.y-py*wa);g.closePath();g.fill();
  }
}
function draw(){
  g.save();if(shake>.5)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  // 宇宙の背景(星雲・瞬く星)
  g.fillStyle='#03040c';g.fillRect(-30,-30,CW+60,CH+60);
  const nb=g.createRadialGradient(CX,CY,RING*.6,CX,CY,CW*.9);nb.addColorStop(0,'rgba(60,40,140,.35)');nb.addColorStop(.5,'rgba(20,60,120,.18)');nb.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=nb;g.fillRect(0,0,CW,CH);
  for(const s of STARS){g.fillStyle='rgba(200,225,255,'+(s.a*(.6+.4*Math.sin(t*.03+s.p)))+')';g.fillRect(s.x,s.y,s.r,s.r);}
  // 重力井戸: 内側の暗い円+回る同心円と放射線の格子
  const well=g.createRadialGradient(CX,CY,CORE,CX,CY,RING);well.addColorStop(0,'rgba(40,30,110,.75)');well.addColorStop(1,'rgba(8,12,40,.85)');
  g.fillStyle=well;g.beginPath();g.arc(CX,CY,RING,0,6.283);g.fill();
  g.save();g.beginPath();g.arc(CX,CY,RING,0,6.283);g.clip();g.strokeStyle='rgba(110,170,255,.10)';g.lineWidth=1;
  for(let r=CORE+30;r<RING;r+=34){g.beginPath();g.arc(CX,CY,r,0,6.283);g.stroke();}
  const ga=t*spin*.5;for(let k=0;k<24;k++){const a=ga+k*.2618;g.beginPath();g.moveTo(CX+Math.cos(a)*CORE*1.4,CY+Math.sin(a)*CORE*1.4);g.lineTo(CX+Math.cos(a)*RING,CY+Math.sin(a)*RING);g.stroke();}
  g.restore();
  // 外周リング: 発光+回る目盛り
  g.save();g.shadowColor='#7a6cff';g.shadowBlur=18;g.strokeStyle='#8a7cff';g.lineWidth=3;g.beginPath();g.arc(CX,CY,RING,0,6.283);g.stroke();g.restore();
  g.strokeStyle='rgba(120,200,255,.55)';g.lineWidth=1;g.beginPath();g.arc(CX,CY,RING+9,0,6.283);g.stroke();
  for(let k=0;k<72;k++){const a=-t*.002+k*.0873,l=k%6?5:11;g.strokeStyle=k%6?'rgba(120,200,255,.35)':'rgba(160,230,255,.85)';g.beginPath();g.moveTo(CX+Math.cos(a)*(RING+9),CY+Math.sin(a)*(RING+9));g.lineTo(CX+Math.cos(a)*(RING+9+l),CY+Math.sin(a)*(RING+9+l));g.stroke();}
  let worst=0;for(const b of balls)worst=Math.max(worst,b.over);
  g.setLineDash([8,8]);g.lineDashOffset=-t*.4;g.strokeStyle=worst>0?'rgba(255,70,70,'+(.5+.5*Math.sin(t*.5))+')':'rgba(110,230,255,.35)';g.lineWidth=2;g.beginPath();g.arc(CX,CY,LINE,0,6.283);g.stroke();g.setLineDash([]);g.lineDashOffset=0;
  // 核: 脈打つ光輪+回る弧+プラズマの芯
  const pulse=1+.06*Math.sin(t*.12),hc=rev>0?'120,200,255':'130,110,255';
  const halo=g.createRadialGradient(CX,CY,CORE*.5,CX,CY,CORE*2.6*pulse);halo.addColorStop(0,'rgba('+hc+',.55)');halo.addColorStop(1,'rgba('+hc+',0)');g.fillStyle=halo;g.beginPath();g.arc(CX,CY,CORE*2.6*pulse,0,6.283);g.fill();
  const cg=g.createRadialGradient(CX,CY,4,CX,CY,CORE);cg.addColorStop(0,rev>0?'#cfeaff':'#fff');cg.addColorStop(.45,rev>0?'#5aa8ff':'#7a6cff');cg.addColorStop(1,'#120a38');g.fillStyle=cg;g.beginPath();g.arc(CX,CY,CORE,0,6.283);g.fill();
  g.lineWidth=2;for(let k=0;k<3;k++){const a=t*spin*2+k*2.094;g.strokeStyle='rgba(200,230,255,.8)';g.beginPath();g.arc(CX,CY,CORE+7,a,a+1.2);g.stroke();g.strokeStyle='rgba(150,120,255,.6)';g.beginPath();g.arc(CX,CY,CORE+14,-a*1.3,-a*1.3+.7);g.stroke();}
  g.strokeStyle='rgba(255,255,255,.5)';for(let k=0;k<3;k++){const a=t*spin*2+k*2.094;g.beginPath();g.moveTo(CX+Math.cos(a)*10,CY+Math.sin(a)*10);g.lineTo(CX+Math.cos(a)*(CORE-4),CY+Math.sin(a)*(CORE-4));g.stroke();}
  if(!over&&started){const sx=CX+Math.cos(ang)*(RING-8),sy=CY+Math.sin(ang)*(RING-8);
    // 照準: レーザーの線と、ねらった核の表面の目印
    const lg=g.createLinearGradient(sx,sy,CX,CY);lg.addColorStop(0,'rgba(120,230,255,.7)');lg.addColorStop(1,'rgba(120,230,255,0)');
    g.strokeStyle=lg;g.lineWidth=2;g.setLineDash([10,6]);g.lineDashOffset=t*.8;g.beginPath();g.moveTo(sx,sy);g.lineTo(CX,CY);g.stroke();g.setLineDash([]);g.lineDashOffset=0;
    g.strokeStyle='rgba(120,230,255,.8)';g.lineWidth=1.5;g.beginPath();g.arc(sx,sy,R[cur]+7,0,6.283);g.stroke();
    for(let k=0;k<4;k++){const a=k*1.571+t*.05;g.beginPath();g.moveTo(sx+Math.cos(a)*(R[cur]+4),sy+Math.sin(a)*(R[cur]+4));g.lineTo(sx+Math.cos(a)*(R[cur]+11),sy+Math.sin(a)*(R[cur]+11));g.stroke();}
    body(cur,sx,sy,R[cur],{alpha:cool>0?.35:1});}
  drawBridges();for(const b of balls)slimeBody(b);
  for(const r of rings){g.globalAlpha=Math.max(0,r.life);g.strokeStyle=r.col;g.lineWidth=5*r.life;g.beginPath();g.arc(r.x,r.y,r.r,0,6.283);g.stroke();g.globalAlpha=1;}
  for(const p of parts){g.fillStyle='hsla('+p.h+',90%,70%,'+Math.min(1,p.life/30)+')';g.fillRect(p.x-2.5,p.y-2.5,5,5);}
  g.textAlign='center';g.font='bold 17px sans-serif';for(const f of floaters){g.globalAlpha=Math.min(1,f.life/25);g.fillStyle='#fff';g.fillText(f.txt,f.x,f.y);g.globalAlpha=1;}
  g.restore();
  // HUD: 角を切ったパネル+四隅のブラケット+走査線
  hudPanel(8,8,190,92);hudPanel(CW-104,8,96,78);
  g.textAlign='left';g.fillStyle='#6fd8ff';g.font='bold 11px '+MONO;g.fillText('SCORE',18,26);g.fillStyle='#fff';g.font='bold 26px '+MONO;g.fillText(score,18,54);g.fillStyle='#6f9fc8';g.font='11px '+MONO;g.fillText('BEST '+best,18,72);
  g.fillStyle='#ffd25a';g.font='bold 12px '+MONO;g.fillText('LV '+lvl+'  NEXT LV '+(20-shots%20)+'発',18,90);
  g.textAlign='center';g.fillStyle='#6fd8ff';g.font='bold 11px '+MONO;g.fillText('NEXT',CW-56,26);body(nxt,CW-56,56,Math.min(R[nxt],22),{});
  g.textAlign='left';g.fillStyle='#8feeff';g.font='bold 11px '+MONO;g.fillText('QUICK MERGE  発射後1.5秒以内: 得点×1.5 / 反重力の充電+1秒',18,CH-68);
  hudPanel(8,CH-58,CW-136,50);
  g.textAlign='left';g.fillStyle=revCd>0?'#667':'#7ff0d0';g.font='bold 12px '+MONO;g.fillText('ANTI-GRAVITY [Space] '+(revCd>0?'CHARGING '+Math.ceil(revCd/60)+'s':'READY')+'  使用中の合体は得点×2',18,CH-38);
  g.fillStyle='#1a2a44';g.fillRect(18,CH-30,CW-160,4);g.fillStyle=revCd>0?'#4a7cff':'#7ff0d0';g.fillRect(18,CH-30,(CW-160)*(1-revCd/420),4);
  g.fillStyle='#6f8fb0';g.font='10px '+MONO;g.fillText('マウスで角度 / クリックで発射 / 核は回り、10秒ごとに逆回転',18,CH-14);
  if(started&&!over){const on=revCd<=0;g.save();if(on){g.shadowColor='#5a8cff';g.shadowBlur=14+6*Math.sin(t*.15);}g.fillStyle=on?'#2c4cff':'#1a2238';cutRect(BTN.x,BTN.y,BTN.w,BTN.h,8);g.fill();g.restore();
    g.strokeStyle=on?'#9cf':'#3a4a6a';g.lineWidth=1.5;cutRect(BTN.x,BTN.y,BTN.w,BTN.h,8);g.stroke();
    g.fillStyle=on?'#fff':'#889';g.font='bold 14px '+MONO;g.textAlign='center';g.fillText(on?'反重力':'充電 '+Math.ceil(revCd/60)+'s',BTN.x+BTN.w/2,BTN.y+BTN.h/2+5);}
  g.fillStyle='rgba(120,200,255,.035)';for(let y=(t*.5)%4;y<CH;y+=4)g.fillRect(0,y,CW,1);
  if(!started)ov('GRAVITY CORE','クリック / タップ / Enter で開始','ぷるぷるのスライム球を核へ撃ち込む。くっついて、同じ球は合体。ライン(点線の輪)を1.5秒越えたら負け');
  else if(over)ov('GAME OVER','SCORE '+score+'   最大Lv '+(maxLv+1),'クリック / Enter でリトライ');
}
const MONO='"Consolas","Courier New",monospace';
const STARS=Array.from({length:160},()=>({x:Math.random()*CW,y:Math.random()*CH,r:Math.random()<.1?2:1,a:.3+Math.random()*.6,p:Math.random()*6.28}));
function cutRect(x,y,w,h,c){g.beginPath();g.moveTo(x+c,y);g.lineTo(x+w,y);g.lineTo(x+w,y+h-c);g.lineTo(x+w-c,y+h);g.lineTo(x,y+h);g.lineTo(x,y+c);g.closePath();}
function hudPanel(x,y,w,h){g.fillStyle='rgba(8,18,40,.72)';cutRect(x,y,w,h,10);g.fill();g.strokeStyle='rgba(90,170,255,.45)';g.lineWidth=1;cutRect(x,y,w,h,10);g.stroke();
  g.strokeStyle='#6fd8ff';g.lineWidth=2;const L=10;g.beginPath();g.moveTo(x+w-L,y);g.lineTo(x+w,y);g.lineTo(x+w,y+L);g.moveTo(x,y+h-L);g.lineTo(x,y+h);g.lineTo(x+L,y+h);g.stroke();}
function ov(a,b,c){g.fillStyle='rgba(3,6,18,.84)';g.fillRect(0,0,CW,CH);g.textAlign='center';g.save();g.shadowColor='#7a6cff';g.shadowBlur=24;g.fillStyle='#fff';g.font='bold 40px '+MONO;g.fillText(a,CW/2,CH/2-30);g.restore();
  g.strokeStyle='rgba(110,200,255,.6)';g.lineWidth=1;g.beginPath();g.moveTo(CW/2-170,CH/2-12);g.lineTo(CW/2+170,CH/2-12);g.stroke();
  g.font='17px '+MONO;g.fillStyle='#7fd8ff';g.fillText(b,CW/2,CH/2+12);g.font='13px sans-serif';g.fillStyle='#9cb8d8';
  const half=c.length>30?c.indexOf('。')+1:0;if(half>0){g.fillText(c.slice(0,half),CW/2,CH/2+42);g.fillText(c.slice(half),CW/2,CH/2+62);}else g.fillText(c,CW/2,CH/2+42);}
const BTN={x:CW-118,y:CH-62,w:104,h:44};
function toC(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*CW/r.width,y:(e.clientY-r.top)*CH/r.height};}
function onBtn(e){const c=toC(e);return c.x>=BTN.x&&c.x<=BTN.x+BTN.w&&c.y>=BTN.y&&c.y<=BTN.y+BTN.h;}
function aimAt(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*CW/r.width,y=(e.clientY-r.top)*CH/r.height;ang=Math.atan2(y-CY,x-CX);}
cv.addEventListener('pointermove',aimAt);
cv.addEventListener('pointerdown',e=>{if(started&&!over&&onBtn(e)){skill();cv._skip=true;return;}aimAt(e);if(!started){started=true;cv._skip=true;return;}if(over){reset();cv._skip=true;}});
cv.addEventListener('pointerup',e=>{if(cv._skip){cv._skip=false;return;}if(!started||over)return;aimAt(e);shoot();});
addEventListener('keydown',e=>{if(e.key==='Enter'){if(!started)started=true;else if(over)reset();return;}if(!started||over)return;if(e.key==='ArrowLeft')ang-=.08;if(e.key==='ArrowRight')ang+=.08;if(e.key==='ArrowDown'){shoot();e.preventDefault();}if(e.key===' '){skill();e.preventDefault();}if(e.key==='m')mute=!mute;});
function loop(ts){acc+=Math.min(100,ts-last);last=ts;while(acc>=16.667){update();acc-=16.667;}draw();requestAnimationFrame(loop);}
requestAnimationFrame(ts=>{last=ts;loop(ts);});
</script>

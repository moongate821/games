<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>VOID FORCE 20</title>
<meta name="description" content="Rタイプ風の横スクロール弾幕シューティング。フォースを育てて20面を抜ける。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">

<style>
  html,body{margin:0;height:100%;background:#05060f;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{position:relative}
  #g,#h{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
  #h{image-rendering:auto}
  #rot{display:none;position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:#9ab;pointer-events:none}
  @media (orientation:portrait){#rot{display:block}}
</style>
</head>

<div id="rot">横向きにすると大きく遊べます</div>
<div id="wrap"><div id="stage"><canvas id="g" width="480" height="270"></canvas><canvas id="h"></canvas></div></div>

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});

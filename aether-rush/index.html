<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050221">
<title>AETHER RUSH</title>
<style>
:root{--c1:#00f0ff;--c2:#ff2bd6;--c3:#ffe14a;--bg:#050221;--ink:#e8f6ff;--dim:#7a86b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.layer{position:fixed;inset:0;pointer-events:none}
.hidden{display:none!important}
/* ---- HUD ---- */
#hud{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);font-family:"Consolas","Courier New",monospace;text-shadow:0 0 8px #000,0 0 14px rgba(0,240,255,.5)}
#hud .tl{position:absolute;left:14px;top:10px}
#pos{font-size:clamp(34px,7vw,64px);font-weight:900;color:var(--c3);line-height:1;letter-spacing:-1px}
#pos small{font-size:.45em;color:var(--ink)}
#lap{font-size:clamp(14px,2.4vw,22px);color:var(--c1);margin-top:4px;letter-spacing:2px}
#hud .tr{position:absolute;right:14px;top:10px;text-align:right;font-size:clamp(13px,2.2vw,20px);letter-spacing:1px}
#time{font-size:clamp(20px,3.6vw,34px);color:#fff}
#best{color:var(--dim)}
#mini{position:absolute;right:12px;top:calc(clamp(60px,9vw,90px));width:clamp(110px,18vw,170px);height:clamp(110px,18vw,170px);opacity:.92}
#hud .bl{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:min(46vw,380px)}
#hud .br{position:absolute;right:16px;bottom:calc(10px + env(safe-area-inset-bottom));text-align:right}
#spd{font-size:clamp(44px,9vw,92px);font-weight:900;line-height:.95;color:#fff;font-style:italic}
#spd small{font-size:.28em;color:var(--c1);margin-left:6px;font-style:normal}
.bar{height:16px;border:2px solid var(--c1);border-radius:3px;background:rgba(0,0,0,.45);padding:2px;display:flex;gap:2px;box-shadow:0 0 10px rgba(0,240,255,.4)}
.bar i{flex:1;background:linear-gradient(#2dff7a,#00b050);opacity:.12;transition:opacity .08s}
.bar i.on{opacity:1}
.bar.low i.on{background:linear-gradient(#ff7a7a,#d01818);animation:blink .35s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
#plabel{font-size:12px;letter-spacing:3px;color:var(--c1);margin-bottom:3px;display:flex;justify-content:space-between}
#boostTag{color:var(--c3);opacity:0;transition:opacity .1s}
#boostTag.on{opacity:1}
#center{position:absolute;left:0;right:0;top:30%;text-align:center;font-weight:900;font-style:italic;font-size:clamp(60px,16vw,170px);color:#fff;text-shadow:0 0 30px var(--c2),0 0 6px var(--c1);letter-spacing:4px;line-height:1}
#center.small{font-size:clamp(26px,5vw,52px);top:22%;color:var(--c3);letter-spacing:3px}
#center.pop{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(1.8);opacity:0}25%{opacity:1}100%{transform:scale(1)}}
#warn{position:absolute;left:0;right:0;top:46%;text-align:center;font-size:clamp(22px,5vw,46px);font-weight:900;color:#ff3a5a;letter-spacing:6px;animation:blink .5s steps(2) infinite}
#flash{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,60,60,.5));opacity:0;transition:opacity .25s}
#flash.on{opacity:1;transition:none}
/* ---- touch ---- */
#touch{padding:env(safe-area-inset-bottom) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid var(--c1);background:rgba(0,20,40,.45);color:var(--c1);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;letter-spacing:1px;box-shadow:0 0 12px rgba(0,240,255,.35)}
.tb.on{background:rgba(0,240,255,.4);color:#fff}
#tL{left:12px;bottom:calc(30px + env(safe-area-inset-bottom));width:84px;height:84px}
#tR{left:108px;bottom:calc(30px + env(safe-area-inset-bottom));width:84px;height:84px}
#tBoost{right:16px;bottom:calc(206px + env(safe-area-inset-bottom));width:92px;height:92px;border-color:var(--c3);color:var(--c3)}
#tDrift{right:20px;bottom:calc(120px + env(safe-area-inset-bottom));width:76px;height:76px;border-color:var(--c2);color:var(--c2)}
#tBrake{right:24px;bottom:calc(40px + env(safe-area-inset-bottom));width:68px;height:68px;border-color:#9aa;color:#9aa}
#tPause{left:14px;top:calc(96px + env(safe-area-inset-top));width:40px;height:40px;font-size:16px}
@media (orientation:portrait){
#tL,#tR{bottom:calc(62px + env(safe-area-inset-bottom))}
#tBoost{bottom:calc(236px + env(safe-area-inset-bottom))}#tDrift{bottom:calc(150px + env(safe-area-inset-bottom))}#tBrake{bottom:calc(70px + env(safe-area-inset-bottom))}
body.touch #hud .br{left:14px;right:auto;bottom:calc(160px + env(safe-area-inset-bottom));text-align:left}
}
@media (orientation:landscape){
#tL{bottom:calc(16px + env(safe-area-inset-bottom))}#tR{bottom:calc(16px + env(safe-area-inset-bottom))}
#tBoost{right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:88px;height:88px}
#tDrift{right:116px;bottom:calc(16px + env(safe-area-inset-bottom))}
#tBrake{right:206px;bottom:calc(16px + env(safe-area-inset-bottom))}
#hud .br{bottom:calc(112px + env(safe-area-inset-bottom))}
#hud .bl{bottom:calc(118px + env(safe-area-inset-bottom))}
}
/* ---- menus ---- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));text-align:center}
.screen.dark{background:radial-gradient(ellipse at center,rgba(5,2,33,.55),rgba(5,2,33,.92))}
.screen.side{justify-content:flex-end;background:linear-gradient(0deg,rgba(5,2,33,.92) 0%,rgba(5,2,33,.55) 45%,rgba(5,2,33,0) 75%)}
.logo{font-size:clamp(46px,12vw,128px);font-weight:900;font-style:italic;letter-spacing:6px;line-height:1;background:linear-gradient(180deg,#fff 10%,var(--c1) 48%,var(--c2) 52%,#6a1bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(0,240,255,.6))}
.sub{letter-spacing:.5em;color:var(--c1);font-size:clamp(12px,2.4vw,20px);margin:8px 0 28px}
.press{font-size:clamp(16px,3vw,26px);letter-spacing:6px;color:var(--c3);animation:blink 1.1s steps(2) infinite;cursor:pointer;padding:12px 24px}
.hint{color:var(--dim);font-size:clamp(11px,1.8vw,14px);line-height:1.8;margin-top:18px;max-width:640px}
.hint b{color:var(--c1);font-weight:700}
h2{margin:0 0 6px;font-size:clamp(20px,4vw,34px);letter-spacing:6px;color:var(--c1);font-style:italic}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:1000px}
.card{pointer-events:auto;cursor:pointer;width:clamp(136px,22vw,210px);padding:10px 10px 12px;border:2px solid #2a2f6a;border-radius:10px;background:rgba(10,8,44,.78);transition:transform .12s,border-color .12s,box-shadow .12s;text-align:left}
.card.sel{border-color:var(--c3);box-shadow:0 0 22px rgba(255,225,74,.55);transform:translateY(-6px)}
.card h3{margin:0;font-size:clamp(13px,2vw,18px);letter-spacing:2px;color:#fff}
.card .jp{font-size:11px;color:var(--dim);margin-bottom:6px}
.card canvas{width:100%;aspect-ratio:1;display:block;background:#07052a;border-radius:6px;margin-bottom:6px}
.stat{display:flex;align-items:center;font-size:11px;color:var(--dim);margin:2px 0;letter-spacing:1px}
.stat span{width:54px}
.stat i{width:12px;height:7px;margin-right:2px;background:#222654;display:inline-block}
.stat i.on{background:var(--c1);box-shadow:0 0 6px var(--c1)}
.desc{margin:12px 0 4px;font-size:clamp(12px,2vw,15px);color:var(--ink);max-width:620px;min-height:2.6em}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.btn{pointer-events:auto;cursor:pointer;min-width:130px;padding:12px 22px;border:2px solid var(--c1);border-radius:8px;background:rgba(0,20,50,.7);color:var(--c1);font-weight:900;letter-spacing:3px;font-size:clamp(13px,2vw,17px)}
.btn.sel,.btn:hover{background:var(--c1);color:#001018;box-shadow:0 0 18px var(--c1)}
.btn.sec{border-color:#5a6aa8;color:#9aa6d8}
table{border-collapse:collapse;font-family:Consolas,monospace;font-size:clamp(12px,2vw,17px);margin:8px 0}
td,th{padding:3px 12px;text-align:left}
th{color:var(--dim);font-weight:400;letter-spacing:2px}
tr.me td{color:var(--c3);background:rgba(255,225,74,.12)}
.big{font-size:clamp(32px,8vw,76px);font-weight:900;font-style:italic;color:var(--c3);text-shadow:0 0 22px var(--c2)}
#muteBtn{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);opacity:.6;z-index:5;pointer-events:auto;border:1px solid #3a4580;background:rgba(5,2,33,.6);color:var(--dim);border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--c1);letter-spacing:8px;font-size:18px;z-index:20}
#err{position:fixed;left:8px;bottom:8px;right:8px;color:#ff8a8a;font-size:12px;z-index:30;white-space:pre-wrap}
@media (max-height:520px){.logo{font-size:44px}.sub{margin:4px 0 12px}.card canvas{display:none}.card{width:clamp(110px,22vw,170px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="layer hidden">
  <div class="tl"><div id="pos">1<small>/8</small></div><div id="lap">LAP 1/3</div></div>
  <div class="tr"><div id="time">0:00.00</div><div id="best">BEST --</div></div>
  <canvas id="mini" width="170" height="170"></canvas>
  <div class="bl"><div id="plabel"><span>POWER</span><span id="boostTag">BOOST</span></div><div class="bar" id="pbar"></div></div>
  <div class="br"><div id="spd">0<small>km/h</small></div></div>
  <div id="center"></div><div id="warn" class="hidden">WRONG WAY</div><div id="flash" class="layer"></div>
</div>
<div id="touch" class="layer hidden">
  <div class="tb" id="tL">◀</div><div class="tb" id="tR">▶</div>
  <div class="tb" id="tBoost">BOOST</div><div class="tb" id="tDrift">DRIFT</div><div class="tb" id="tBrake">BRAKE</div>
  <div class="tb" id="tPause">Ⅱ</div>
</div>
<button id="muteBtn">♪ ON</button>
<div id="ui"></div>
<div id="loading">LOADING…</div>
<div id="err"></div>
<script>
window.addEventListener('error', function (e) { var d = document.getElementById('err'); if (d) d.textContent += (e.message || e) + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno + '\n'; });
window.addEventListener('unhandledrejection', function (e) { var d = document.getElementById('err'); if (d) d.textContent += 'promise: ' + (e.reason && e.reason.stack || e.reason) + '\n'; });
</script>
<script type="module" src="js/main.js?v=1"></script>
</body>
</html>

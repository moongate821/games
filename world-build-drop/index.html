<style>
  html,body{margin:0;height:100%;background:#0a1030;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
  canvas{max-width:100%;max-height:100%;min-height:0;background:#000}
  #pad{display:none;gap:10px;margin:8px 0}
  #pad button{width:60px;height:60px;border-radius:16px;border:2px solid #b9a0ff;background:#2a1a5a;color:#fff;font-size:22px;touch-action:manipulation}
  #pad button:active{background:#6a4ad0}
  @media (hover:none){body[data-scene=play] #pad{display:flex}}
</style>
</head>
<body data-scene="menu">
<div id="wrap">
  <canvas id="c" width="960" height="640"></canvas>
  <div id="pad">
    <button data-a="left">◀</button><button data-a="right">▶</button>
    <button data-a="down">▼</button><button data-a="rot">⟳</button><button data-a="act">◉</button>
  </div>
</div>
